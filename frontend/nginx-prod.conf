# nginx-prod.conf

# Serve on port 80
server {
    listen       80;
    server_name  _;                    # catch all

    # Path to your built React app
    root   /usr/share/nginx/html;
    index  index.html;

    # Main handler: serve files directly, fall back to index.html
    location / {
        # Try to serve file, otherwise fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|eot|ttf|woff|woff2)$ {
        # 1 year cache for fingerprinted assets
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression for text-based assets
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_proxied      any;
    gzip_min_length   256;

    # Disable access logs if you want quieter containers
    access_log off;
    error_log  /var/log/nginx/error.log warn;
}