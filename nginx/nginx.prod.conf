#   img-src 'self' data:;
#   frame-src https://js.stripe.com https://accounts.google.com;
#   connect-src 'self';
# " always;


    # Security headers (optional but recommended)
    # add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;


    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Include MIME types
    include /etc/nginx/mime.types;


    server {
        listen 443 ssl;
        server_name cephadex.com www.cephadex.com;

        ssl_certificate      /etc/ssl/cloudflare/origin.crt;
        ssl_certificate_key  /etc/ssl/cloudflare/origin.key;

        location / {
            proxy_pass http://ceph-frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Optional: WebSocket Timeout Adjustments
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
        location /api/ {
            proxy_pass http://ceph-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Force HTTP/1.1 for WebSocket support (HTTP/2 doesn't support WebSocket upgrades)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            
            # WebSocket timeouts
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;   
        }

        location /minio/ {
            rewrite ^/minio(/.*)$ $1 break;
            proxy_pass http://ceph-minio:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /pgadmin/ {
            rewrite ^/pgadmin(/.*)$ $1 break;
            proxy_pass http://ceph-pgadmin:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /pgadmin;
            
            # pgAdmin specific headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            
            # Handle static assets properly
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # location /minio-console/ {
        #     rewrite ^/minio-console(/.*)$ $1 break;
        #     proxy_pass http://ceph-minio:9003;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;

        #     # Additional headers required by MinIO Console
        #     proxy_http_version 1.1;
        #     proxy_set_header Connection '';
        #     chunked_transfer_encoding off;
        #     proxy_buffering off;
        #     proxy_cache off;
        # }
        # location /db/ {
        #     proxy_pass http://postgres:5432/;
        # }
    }
}